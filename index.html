<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MMG読影ノート</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --sub:#6b7280; --accent:#2f6fde; --line:#e3e6eb;
          --over:#d97706; --under:#dc2626; --calc:#7c3aed; --cat:#0891b2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line);
           padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  nav { display:flex; gap:6px; padding:10px 14px; overflow-x:auto; }
  nav button { flex:none; }
  main { padding:0 14px 40px; max-width:900px; margin:0 auto; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.on { background:var(--text); color:#fff; border-color:var(--text); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
  input[type=text], input[type=date], select, textarea { width:100%; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:80px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { margin:0; display:flex; align-items:center; gap:4px; color:var(--text); font-size:14px;
                 border:1px solid var(--line); border-radius:20px; padding:4px 10px; }
  .tag { display:inline-block; font-size:12px; color:#fff; border-radius:10px; padding:2px 8px; margin:2px 4px 2px 0; }
  .t-読みすぎ { background:var(--over); } .t-読まなさすぎ { background:var(--under); }
  .t-石灰化見落とし { background:var(--calc); } .t-カテゴリーズレ { background:var(--cat); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .thumb { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; }
  .thumb img { width:100%; height:140px; object-fit:cover; background:#000; display:block; }
  .thumb .meta { padding:6px 8px; font-size:12px; }
  .viewer img { width:100%; max-height:70vh; object-fit:contain; background:#000; border-radius:8px; }
  .muted { color:var(--sub); font-size:13px; }
  .hidden { display:none !important; }
  #login { text-align:center; padding:60px 20px; }
  .answer { border-top:1px dashed var(--line); margin-top:10px; padding-top:10px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1d2330; color:#fff;
           padding:8px 14px; border-radius:8px; font-size:14px; z-index:9; }
</style>
</head>
<body>

<header>
  <h1>MMG読影ノート</h1>
  <span id="userEmail" class="muted"></span>
  <button id="logoutBtn" class="hidden">ログアウト</button>
</header>

<section id="login">
  <p>個人を特定できる情報（氏名・ID・生年月日・画像内の文字）は入れないでください。</p>
  <button id="loginBtn" class="primary">Googleでログイン</button>
  <p id="loginMsg" class="muted"></p>
</section>

<div id="app" class="hidden">
  <nav>
    <button data-view="list" class="on">一覧</button>
    <button data-view="edit">＋新規</button>
    <button data-view="review">ランダム復習</button>
    <button data-view="backup">バックアップ</button>
  </nav>
  <main>

    <!-- 一覧 -->
    <section id="view-list">
      <div class="card">
        <div class="row">
          <div><label>ミスの種類で絞り込み</label>
            <select id="filterType"><option value="">すべて</option></select></div>
          <div><label>キーワード</label><input type="text" id="filterText" placeholder="所見・メモを検索"></div>
        </div>
        <p class="muted" id="countInfo"></p>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- 登録・編集 -->
    <section id="view-edit" class="hidden">
      <div class="card">
        <label>画像（自動で縮小して保存）</label>
        <input type="file" id="imgInput" accept="image/*">
        <div class="viewer"><img id="imgPreview" class="hidden" alt=""></div>
        <div class="row">
          <div><label>日付</label><input type="date" id="fDate"></div>
          <div><label>症例名（ID・氏名は不可）</label><input type="text" id="fTitle" placeholder="例：講習会 症例12"></div>
        </div>
        <div class="row">
          <div><label>自分のカテゴリー</label><select id="fMyCat"></select></div>
          <div><label>正解カテゴリー</label><select id="fAnsCat"></select></div>
        </div>
        <label>ミスの種類</label>
        <div class="chips" id="fTypes"></div>
        <label>正解の所見</label>
        <textarea id="fFinding" placeholder="例：右MLO U領域 微細鋸歯状の腫瘤"></textarea>
        <label>自分の読み・反省</label>
        <textarea id="fMemo" placeholder="例：乳腺と重なって見落とした。CCでも確認すべきだった"></textarea>
        <div class="row" style="margin-top:12px">
          <button class="primary" id="saveBtn">保存</button>
          <button id="deleteBtn" class="hidden">削除</button>
          <button id="cancelBtn">キャンセル</button>
        </div>
      </div>
    </section>

    <!-- ランダム復習 -->
    <section id="view-review" class="hidden">
      <div class="card">
        <label>出題範囲</label>
        <select id="reviewType"><option value="">すべて</option></select>
        <div class="row" style="margin-top:10px">
          <button class="primary" id="nextBtn">次の問題</button>
        </div>
      </div>
      <div class="card hidden" id="quiz">
        <div class="viewer"><img id="quizImg" alt=""></div>
        <p class="muted" id="quizTitle"></p>
        <button id="showAnsBtn">答えを見る</button>
        <div class="answer hidden" id="quizAns"></div>
      </div>
    </section>

    <!-- バックアップ -->
    <section id="view-backup" class="hidden">
      <div class="card">
        <p>全データ（画像含む）をJSONファイルで書き出します。月1回程度の保存をおすすめします。</p>
        <button class="primary" id="exportBtn">書き出す</button>
      </div>
      <div class="card">
        <p>書き出したJSONファイルから復元します（同じIDのデータは上書き）。</p>
        <input type="file" id="importInput" accept="application/json">
      </div>
    </section>

  </main>
</div>

<script type="module">
// ==== ここに Firebase コンソールでコピーした firebaseConfig を貼り付ける ====
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};
// ===========================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, setDoc, deleteDoc, getDocs, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache() }); // オフラインでも閲覧可

const TYPES = ["読みすぎ", "読まなさすぎ", "石灰化見落とし", "カテゴリーズレ"];
const CATS = ["", "1", "2", "3", "4", "5", "N（判定不能）"];
const $ = id => document.getElementById(id);
let user = null, cases = [], editingId = null, editingImg = null, unsub = null;

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const tagsHtml = types => (types || []).map(t => `<span class="tag t-${t}">${t}</span>`).join("");

// ---- 初期UI ----
for (const sel of [$("filterType"), $("reviewType")]) TYPES.forEach(t => sel.add(new Option(t, t)));
for (const sel of [$("fMyCat"), $("fAnsCat")]) CATS.forEach(c => sel.add(new Option(c ? "カテゴリー " + c : "未選択", c)));
$("fTypes").innerHTML = TYPES.map(t => `<label><input type="checkbox" value="${t}">${t}</label>`).join("");

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  if (b.dataset.view === "edit") openEdit(null); else show(b.dataset.view);
});
function show(view) {
  ["list", "edit", "review", "backup"].forEach(v => $("view-" + v).classList.toggle("hidden", v !== view));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  window.scrollTo(0, 0);
}

// ---- ログイン ----
$("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { $("loginMsg").textContent = "ログイン失敗: " + e.code; }
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  user = u;
  $("login").classList.toggle("hidden", !!u);
  $("app").classList.toggle("hidden", !u);
  $("logoutBtn").classList.toggle("hidden", !u);
  $("userEmail").textContent = u ? u.email : "";
  if (unsub) { unsub(); unsub = null; }
  if (u) {
    unsub = onSnapshot(collection(db, "users", u.uid, "cases"), snap => {
      cases = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                       .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      renderList();
    }, err => toast("読み込みエラー: " + err.code + "（ルールを確認）"));
  }
});

// ---- 一覧 ----
$("filterType").onchange = renderList;
$("filterText").oninput = renderList;
function renderList() {
  const ft = $("filterType").value, q = $("filterText").value.trim();
  const list = cases.filter(c => (!ft || (c.types || []).includes(ft)) &&
    (!q || [c.title, c.finding, c.memo].join(" ").includes(q)));
  $("countInfo").textContent = `${list.length} 件 / 全 ${cases.length} 件`;
  $("grid").innerHTML = list.map(c => `
    <div class="thumb" data-id="${c.id}">
      ${c.img ? `<img src="${c.img}" alt="">` : `<img alt="">`}
      <div class="meta"><b>${esc(c.title) || "（無題）"}</b><br>
        <span class="muted">${esc(c.date)}</span><br>${tagsHtml(c.types)}</div>
    </div>`).join("");
  document.querySelectorAll(".thumb").forEach(el => el.onclick = () => openEdit(el.dataset.id));
}

// ---- 登録・編集 ----
function openEdit(id) {
  const c = id ? cases.find(x => x.id === id) : null;
  editingId = id; editingImg = c?.img || null;
  $("fDate").value = c?.date || new Date().toISOString().slice(0, 10);
  $("fTitle").value = c?.title || "";
  $("fMyCat").value = c?.myCat || "";
  $("fAnsCat").value = c?.ansCat || "";
  $("fFinding").value = c?.finding || "";
  $("fMemo").value = c?.memo || "";
  document.querySelectorAll("#fTypes input").forEach(i => i.checked = (c?.types || []).includes(i.value));
  $("imgInput").value = "";
  $("imgPreview").src = editingImg || "";
  $("imgPreview").classList.toggle("hidden", !editingImg);
  $("deleteBtn").classList.toggle("hidden", !id);
  show("edit");
}

// 画像を縮小してJPEG化（Firestoreの1件1MB上限に収める）
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let max = 1400, q = 0.8, out;
      do {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        out = cv.toDataURL("image/jpeg", q);
        max -= 200; q -= 0.1;
      } while (out.length > 700000 && max > 400);
      URL.revokeObjectURL(img.src); resolve(out);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
$("imgInput").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  editingImg = await compress(f);
  $("imgPreview").src = editingImg; $("imgPreview").classList.remove("hidden");
};

$("saveBtn").onclick = async () => {
  const id = editingId || crypto.randomUUID();
  const data = {
    date: $("fDate").value, title: $("fTitle").value.trim(),
    myCat: $("fMyCat").value, ansCat: $("fAnsCat").value,
    types: [...document.querySelectorAll("#fTypes input:checked")].map(i => i.value),
    finding: $("fFinding").value.trim(), memo: $("fMemo").value.trim(),
    img: editingImg || "", updatedAt: Date.now()
  };
  try {
    await setDoc(doc(db, "users", user.uid, "cases", id), data);
    toast("保存しました"); show("list");
  } catch (e) { toast("保存失敗: " + e.code); }
};
$("deleteBtn").onclick = async () => {
  if (!confirm("この症例を削除しますか？（元に戻せません）")) return;
  await deleteDoc(doc(db, "users", user.uid, "cases", editingId));
  toast("削除しました"); show("list");
};
$("cancelBtn").onclick = () => show("list");

// ---- ランダム復習 ----
$("nextBtn").onclick = () => {
  const t = $("reviewType").value;
  const pool = cases.filter(c => c.img && (!t || (c.types || []).includes(t)));
  if (!pool.length) { toast("該当する症例がありません"); return; }
  const c = pool[Math.floor(Math.random() * pool.length)];
  $("quiz").classList.remove("hidden");
  $("quizImg").src = c.img;
  $("quizTitle").textContent = `${c.title || "（無題）"}　— カテゴリーと所見を考えてから答えを見る`;
  $("quizAns").classList.add("hidden");
  $("quizAns").innerHTML = `
    <p>${tagsHtml(c.types)}</p>
    <p><b>正解カテゴリー:</b> ${esc(c.ansCat) || "-"}　<span class="muted">（当時の自分: ${esc(c.myCat) || "-"}）</span></p>
    <p><b>所見:</b> ${esc(c.finding).replace(/\n/g, "<br>")}</p>
    <p><b>反省:</b> ${esc(c.memo).replace(/\n/g, "<br>")}</p>`;
};
$("showAnsBtn").onclick = () => $("quizAns").classList.remove("hidden");

// ---- バックアップ ----
$("exportBtn").onclick = async () => {
  const snap = await getDocs(collection(db, "users", user.uid, "cases"));
  const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const blob = new Blob([JSON.stringify({ app: "mmg-note", version: 1, exportedAt: new Date().toISOString(), cases: all }, null, 1)],
                        { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mmg-note-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
};
$("importInput").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const json = JSON.parse(await f.text());
    if (!confirm(`${json.cases.length} 件を復元しますか？`)) return;
    for (const c of json.cases) { const { id, ...data } = c; await setDoc(doc(db, "users", user.uid, "cases", id), data); }
    toast("復元しました");
  } catch (err) { toast("復元失敗: ファイルを確認してください"); }
  e.target.value = "";
};
</script>
</body>
</html>
